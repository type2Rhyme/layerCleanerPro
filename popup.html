<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>layerCleanerPro</title>

  <style>

    body {
      width: 230px;
      margin: 0;
      padding: 10px;

      font-family: sans-serif;
    }

    #domain-info {
      margin-bottom: 10px;

      color: #333;

      font-weight: bold;
      text-align: center;
      word-break: break-all;
    }

    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 9px;

      border: none;
      border-radius: 4px;

      color: #ffffff;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
    }

    button:last-child {
      margin-bottom: 0;
    }

    .btn-green {
      background-color: #28a745;
    }

    .btn-green:hover {
      background-color: #218838;
    }

    .btn-red {
      background-color: #dc3545;
    }

    .btn-red:hover {
      background-color: #c82333;
    }

  </style>

</head>

<body>

  <div id="domain-info">
    Loading...
  </div>

  <!-- Tab Blocking -->

  <button
    id="block-tab-btn"
    style="display:none;">
  </button>

  <!-- Layer Cleaning -->

  <button
    id="block-layer-btn"
    style="display:none;">
  </button>

  <script src="popup.js"></script>

</body>

</html>
